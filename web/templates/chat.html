<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mobile Operator Support Chat</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
      background: #f5f6f8;
      color: #1a1a1a;
    }
    h1 { font-size: 1.25rem; }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.25rem; color: #555; }
    .row { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
    .row > div { flex: 1; }
    #phone_number, #backend {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      background: #fff;
    }
    #log {
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      min-height: 300px;
      max-height: 55vh;
      overflow-y: auto;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .msg { margin-bottom: 0.75rem; }
    .msg .who { font-size: 0.75rem; color: #888; margin-bottom: 0.15rem; }
    .msg.user .bubble { background: #2563eb; color: #fff; margin-left: auto; }
    .msg.agent .bubble { background: #eee; color: #1a1a1a; }
    .bubble {
      display: inline-block;
      padding: 0.5rem 0.75rem;
      border-radius: 10px;
      max-width: 85%;
      white-space: pre-wrap;
    }
    .msg.user { text-align: right; }
    form { display: flex; gap: 0.5rem; }
    #question {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 0.6rem 1.1rem;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #9ab3e8; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Mobile Operator Support Chat</h1>

  <div class="row">
    <div>
      <label for="phone_number">Phone number (identifies your conversation)</label>
      <input id="phone_number" value="0641234567">
    </div>
    <div>
      <label for="backend">AI support model</label>
      <select id="backend">
        <option value="langgraph" selected>LangGraph (stateful, human-in-the-loop)</option>
        <option value="langchain">LangChain (ReAct agent, tools + RAG)</option>
      </select>
    </div>
  </div>

  <div id="log"></div>

  <form id="chat-form">
    <input id="question" placeholder="Ask a question..." autocomplete="off" required>
    <button type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById("log");
    const form = document.getElementById("chat-form");
    const questionInput = document.getElementById("question");
    const phoneInput = document.getElementById("phone_number");
    const backendSelect = document.getElementById("backend");

    function addMessage(who, text) {
      /*
        <div class="msg user">
          <div class="who">You</div>
          <div class="bubble">I want a refund for last month</div>
        </div> 
      */
      const msg = document.createElement("div");
      msg.className = "msg " + who;
      msg.innerHTML = `<div class="who">${who === "user" ? "You" : "Support"}</div><div class="bubble"></div>`;
      msg.querySelector(".bubble").textContent = text;
      log.appendChild(msg);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      const phone_number = phoneInput.value.trim();
      if (!question || !phone_number) return;

      addMessage("user", question);
      questionInput.value = "";
      form.querySelector("button").disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ phone_number, question, backend: backendSelect.value }),
        });
        const data = await response.json();
        addMessage("agent", response.ok ? data.answer : `Error: ${data.error || response.status}`);
      } catch (err) {
        addMessage("agent", `Error: ${err}`);
      } finally {
        form.querySelector("button").disabled = false;
        questionInput.focus();
      }
    });
  </script>
</body>
</html>
